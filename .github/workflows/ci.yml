name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: [self-hosted, linux, x64]
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      JWT_SECRET: tekkipro-test-secret-32chars-minimum-ok
      JWT_EXPIRES_IN: 7d
      DATABASE_URL: postgresql://test:test@localhost:5432/tekkipro_test
      FRONTEND_URL: http://localhost:5174
      APP_URL: http://localhost:5001
      PORT: "5001"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  frontend:
    runs-on: [self-hosted, linux, x64]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to VPS
    needs: [backend, frontend]
    runs-on: [self-hosted, linux, x64]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy
        run: bash /opt/tekkipro/deploy.sh main
