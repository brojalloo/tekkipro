name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: [self-hosted, linux, x64]
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      JWT_SECRET: tekkipro-test-secret-32chars-minimum-ok
      JWT_EXPIRES_IN: 7d
      DATABASE_URL: postgresql://test:test@localhost:5432/tekkipro_test
      FRONTEND_URL: http://localhost:5174
      APP_URL: http://localhost:5001
      PORT: "5001"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: rm -rf node_modules && npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  frontend:
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (root workspace)
        run: rm -rf node_modules frontend/node_modules mobile/node_modules && npm ci

      - name: Lint
        run: npm run lint -w frontend

      - name: Test
        run: npm run test -w frontend

      - name: Build
        run: npm run build -w frontend

  deploy:
    name: Deploy to VPS
    needs: [backend, frontend]
    runs-on: [self-hosted, linux, x64]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy
        run: bash /opt/tekkipro/deploy.sh main