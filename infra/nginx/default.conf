# Redirect HTTP -> HTTPS
server {
    listen 80;
    server_name tekkipro.com www.tekkipro.com;
    return 301 https://tekkipro.com$request_uri;
}

# Redirect www -> non-www
server {
    listen 443 ssl;
    server_name www.tekkipro.com;
    ssl_certificate /etc/letsencrypt/live/tekkipro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tekkipro.com/privkey.pem;
    return 301 https://tekkipro.com$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl;
    server_name tekkipro.com;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;
    keepalive_timeout 15s;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    ssl_certificate /etc/letsencrypt/live/tekkipro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tekkipro.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/manifest+json
        image/svg+xml
        font/woff
        font/woff2;

    # Cache open file descriptors for static assets
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-XSS-Protection "0" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.sentry.io https://*.ingest.sentry.io https://app.posthog.com https://eu.posthog.com; worker-src 'self' blob:; manifest-src 'self'; frame-src 'self' blob:" always;

    location /api/ {
        limit_except GET POST PUT PATCH DELETE OPTIONS { deny all; }
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_hide_header X-Powered-By;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        add_header Cache-Control "no-store" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Static assets: 1 year immutable cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
