version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tekkipro_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tekkipro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tekkipro_dev_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-tekkipro}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tekkipro}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tekkipro_net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: tekkipro_api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-tekkipro}:${POSTGRES_PASSWORD:-tekkipro_dev_password_change_me}@postgres:5432/${POSTGRES_DB:-tekkipro}?schema=public
      JWT_SECRET: ${JWT_SECRET:-local_dev_jwt_secret_change_me_please_12345}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      APP_URL: ${APP_URL:-http://localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      AUTH_RATE_LIMIT_WINDOW_MS: ${AUTH_RATE_LIMIT_WINDOW_MS:-900000}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
      PASSWORD_RESET_RATE_LIMIT_WINDOW_MS: ${PASSWORD_RESET_RATE_LIMIT_WINDOW_MS:-900000}
      PASSWORD_RESET_RATE_LIMIT_MAX: ${PASSWORD_RESET_RATE_LIMIT_MAX:-5}
      PAYMENT_WRITE_RATE_LIMIT_WINDOW_MS: ${PAYMENT_WRITE_RATE_LIMIT_WINDOW_MS:-300000}
      PAYMENT_WRITE_RATE_LIMIT_MAX: ${PAYMENT_WRITE_RATE_LIMIT_MAX:-10}
      PAYMENT_READ_RATE_LIMIT_WINDOW_MS: ${PAYMENT_READ_RATE_LIMIT_WINDOW_MS:-300000}
      PAYMENT_READ_RATE_LIMIT_MAX: ${PAYMENT_READ_RATE_LIMIT_MAX:-60}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-TekkiPro <noreply@tekkipro.com>}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      WAVE_API_KEY: ${WAVE_API_KEY:-}
      WAVE_WEBHOOK_SECRET: ${WAVE_WEBHOOK_SECRET:-}
      ORANGE_MONEY_API_KEY: ${ORANGE_MONEY_API_KEY:-}
      ORANGE_MONEY_MERCHANT_KEY: ${ORANGE_MONEY_MERCHANT_KEY:-}
    ports:
      - '127.0.0.1:5000:5000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - tekkipro_net

  redis:
    image: redis:7-alpine
    container_name: tekkipro_redis
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tekkipro_net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: tekkipro_web
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /var/log/nginx:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tekkipro_net

  backup:
    image: postgres:16-alpine
    container_name: tekkipro_backup
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tekkipro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tekkipro_dev_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-tekkipro}
      PGPASSWORD: ${POSTGRES_PASSWORD:-tekkipro_dev_password_change_me}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - backup_data:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tekkipro_net
    entrypoint:
      - sh
      - -c
      - |
        echo 'Service backup demarré.'
        while true; do
          NEXT=$$(( 86400 - $$(date +%s) % 86400 + 7200 ))
          sleep $$NEXT
          TIMESTAMP=$$(date +%Y%m%d_%H%M%S)
          FILE=/backups/tekkipro_$${TIMESTAMP}.sql.gz
          pg_dump -h postgres -U $$POSTGRES_USER -d $$POSTGRES_DB --no-password --format=plain --no-owner --no-acl | gzip > $$FILE
          find /backups -name 'tekkipro_*.sql.gz' -mtime +$$RETENTION_DAYS -delete
        done

volumes:
  postgres_data:
    name: tekkipro_postgres_data
  backup_data:
    name: tekkipro_backup_data

networks:
  tekkipro_net:
    name: tekkipro_network
    driver: bridge
